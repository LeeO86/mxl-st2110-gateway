# First-start configuration, copied to /config/gateway.json by the init container only if the file
# does not exist yet (the gateway owns the file afterwards, §9.1). Identity, ports, registry and the output
# domain come from the pod's environment (deployment.yaml); groups are created in the admin UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mxl-st2110-gateway-seed
  namespace: mxl
data:
  gateway.json: |
    {
      "schema_version": 1,
      "node": {
        "description": "ST 2110 <-> MXL gateway",
        "resume_connections": true
      },
      "nic": {
        "backend": "dpdk",
        "port_pairs": [
          {
            "name": "media",
            "primary":   { "name": "media-p", "pci": "env:PCIDEVICE_INTEL_COM_E810_MEDIA_P", "ip": "10.1.1.21", "netmask": "255.255.255.0" },
            "redundant": { "name": "media-r", "pci": "env:PCIDEVICE_INTEL_COM_E810_MEDIA_R", "ip": "10.2.1.21", "netmask": "255.255.255.0" }
          }
        ]
      },
      "ptp": { "mode": "builtin", "domain": 127, "require_lock": true },
      "groups": []
    }
