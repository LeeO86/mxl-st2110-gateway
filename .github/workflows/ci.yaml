name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned dependencies — keep in sync with the build args in docker/Dockerfile. These two files are
  # the only places the pins live (AGENTS.md); the "pins" step below fails if they differ.
  MTL_REF: v26.09
  DPDK_VER: "26.07"
  MXL_REF: v1.1.0
  MXL_REVISION: 8f3f1096e804bfb822eb959cdf2fc23199a7d15d # commit of MXL_REF (image label io.dmf.mxl.revision)
  NMOS_CPP_REF: fe303849527394b03bdedc8f161f377fe458bb62
  ICE_VER: 2.6.7
  ICE_DMID: "923747"
  # AMWA nmos-testing used by tests/integration/nmos-testing.sh.
  NMOS_TESTING_REF: 90018513758e6fbc096c26d7ef001f700b28b510

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18 shellcheck python3-jsonschema python3-yaml

      - name: Pins in sync with docker/Dockerfile
        run: |
          fail=0
          for v in MTL_REF DPDK_VER MXL_REF MXL_REVISION NMOS_CPP_REF ICE_VER ICE_DMID; do
            docker_value=$(sed -n "s/^ARG $v=//p" docker/Dockerfile)
            if [ "$docker_value" != "${!v}" ]; then
              echo "::error file=docker/Dockerfile::$v is '$docker_value' in docker/Dockerfile but '${!v}' in ci.yaml"
              fail=1
            fi
          done
          exit $fail

      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' '*.h' ':!:third_party/*' | xargs clang-format-18 --dry-run --Werror

      - name: shellcheck
        run: shellcheck -x -e SC1091,SC2034 tests/integration/*.sh docker/entrypoint.sh

      - name: Grafana dashboard is up to date
        run: python3 monitoring/tools/gen_dashboard.py --check

      - name: Configurations match the schema
        run: python3 tools/validate_configs.py

      - name: docs/configuration.md is up to date
        run: python3 tools/gen_config_docs.py --check

      - name: docker compose config
        run: |
          docker compose -f docker/docker-compose.yaml config -q
          docker compose -f docker/docker-compose.fabrics.yaml --profile host-a config -q
          docker compose -f docker/docker-compose.fabrics.yaml --profile host-b config -q

      - name: kubeconform
        run: |
          docker run --rm -v "$PWD":/src registry.k8s.io/kustomize/kustomize:v5.4.3 build /src/deploy/k8s > base.yaml
          docker run --rm -v "$PWD":/src registry.k8s.io/kustomize/kustomize:v5.4.3 build /src/deploy/k8s/fabrics > fabrics.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary < base.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary < fabrics.yaml
          docker run --rm -v "$PWD":/src ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /src/deploy/k8s/servicemonitor.yaml

  mtl-patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: patches/mtl apply to MTL ${{ env.MTL_REF }}
        run: |
          git clone --depth 1 --branch "$MTL_REF" https://github.com/OpenVisualCloud/Media-Transport-Library /tmp/mtl
          for p in patches/mtl/*.patch; do
            echo "checking $p"
            git -C /tmp/mtl apply --check "$PWD/$p"
            git -C /tmp/mtl apply "$PWD/$p"
          done

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build

  # Compiles with -Werror and runs the unit tests (docker build stage `build`), then packs the
  # runtime image for the integration jobs.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (unit tests run in the build stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: mxlgw:ci
          load: true
          build-args: |
            MTL_REF=${{ env.MTL_REF }}
            DPDK_VER=${{ env.DPDK_VER }}
            MXL_REF=${{ env.MXL_REF }}
            MXL_REVISION=${{ env.MXL_REVISION }}
            NMOS_CPP_REF=${{ env.NMOS_CPP_REF }}
            ICE_VER=${{ env.ICE_VER }}
            ICE_DMID=${{ env.ICE_DMID }}
            MXLGW_VERSION=0.0.0-dev+${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=mxlgw
          cache-to: type=gha,scope=mxlgw,mode=max
      - name: Export image
        run: docker save mxlgw:ci | zstd -T0 -3 > mxlgw-ci.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: mxlgw-ci-image
          path: mxlgw-ci.tar.zst
          retention-days: 3

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: libFuzzer, 60 s per target (sdp, anc8331)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: fuzz
          push: false
          build-args: |
            MTL_REF=${{ env.MTL_REF }}
            DPDK_VER=${{ env.DPDK_VER }}
            MXL_REF=${{ env.MXL_REF }}
            MXL_REVISION=${{ env.MXL_REVISION }}
            NMOS_CPP_REF=${{ env.NMOS_CPP_REF }}
            ICE_VER=${{ env.ICE_VER }}
            ICE_DMID=${{ env.ICE_DMID }}
            FUZZ_SECONDS=60
          no-cache-filters: fuzz
          cache-from: type=gha,scope=mxlgw

  integration:
    needs: image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: [smoke, lifecycle, loopback, late-flow, nmos-testing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mxlgw-ci-image
      - name: Load image
        run: zstd -dc mxlgw-ci.tar.zst | docker load
      - name: Host preparation (hugepages, rmem)
        run: |
          sudo sysctl -w vm.nr_hugepages=1024
          sudo sysctl -w net.core.rmem_max=4194304 net.core.wmem_max=4194304
      - name: tests/integration/${{ matrix.test }}.sh
        run: tests/integration/${{ matrix.test }}.sh mxlgw:ci
        env:
          IT_ARTIFACTS: ${{ github.workspace }}/it-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.test }}
          path: it-artifacts
          if-no-files-found: ignore
