# mxl-st2110-gateway on one host (SPECIFICATION.md §15.1, README "Quick start").
#
# Prerequisites (README "Host preparation"): hugepages, media PFs bound to vfio-pci, the host MXL
# root as tmpfs (/etc/fstab: `tmpfs /Volumes/mxl tmpfs size=8g,mode=1777 0 0`) and CLOCK_TAI
# disciplined by the host (ptp4l + phc2sys, or chrony with `leapsectz right/UTC`).
#
#   mkdir -p config && docker compose up -d
#   open http://<host>:8080/admin/   (setup mode until the NIC is configured)
services:
  mxl-st2110-gateway:
    image: ${MXLGW_IMAGE:-ghcr.io/leeo86/mxl-st2110-gateway:1.0.1}
    container_name: mxl-st2110-gateway
    restart: unless-stopped
    init: true
    # The media ports are DPDK-owned; NMOS announces the host's address. Ports: NMOS_PORT (MXL node, UI,
    # API, metrics, health) and NMOS_PORT + 1 (ST 2110 node).
    network_mode: host
    stop_grace_period: 15s # > SHUTDOWN_TIMEOUT_S
    # Root for DPDK's VFIO device nodes (root-owned), group 1000 shared with the other media functions
    # (README "Users and permissions"). The image itself runs as 1000:1000.
    user: "0:1000"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    cap_add: [IPC_LOCK, SYS_NICE] # + SYS_TIME only for ptp.mode=builtin_phc2sys
    devices:
      - /dev/vfio:/dev/vfio
    volumes:
      - ./config:/config # gateway.json + state/
      - /dev/hugepages:/dev/hugepages
      # Host MXL root, shared with other media functions and mxl-fabrics-agent on this host. The
      # gateway writes only to its configured domains (MXL_OUTPUT_DOMAIN_DIR) and discovers sibling
      # and mirror-<id> domains (§8.5). The container path may differ per container; the identity of a
      # domain comes from its domain_def.json.
      - type: bind
        source: /Volumes/mxl
        target: /Volumes/mxl
      # Only with NMOS_DNS_SD=true: the host's avahi-daemon (D-Bus for browsing, the avahi socket for .local
      # names), and on AppArmor hosts `security_opt: ["apparmor=unconfined"]`.
      # - /run/dbus:/run/dbus
      # - /run/avahi-daemon:/run/avahi-daemon
    environment:
      NMOS_SEED: gw-studio1 # every NMOS id and the output domain id derive from it
      NMOS_LABEL: GW-STUDIO1
      # NMOS_HOST_ADDRESS: "10.10.0.21"   # default: the IPv4 of the default-route interface
      NMOS_REGISTRY_ADDRESS: "10.10.0.5" # static registry of the MXL node; unset = no registry
      NMOS_REGISTRY_PORT: "3210"
      NMOS_PORT: "8080" # e.g. 8090 when mxl-decklink already uses 8080 on this host (§15.4)
      MXL_DOMAIN_SCAN_PATH: /Volumes/mxl
      MXL_OUTPUT_DOMAIN_DIR: /Volumes/mxl/gw-studio1
      SHUTDOWN_TIMEOUT_S: "10"
      # MXLGW_LOG_FORMAT: text
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${WEB_PORT:-$${NMOS_PORT:-8080}}/livez"]
      interval: 10s
      timeout: 3s
      start_period: 60s
