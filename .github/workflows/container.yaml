name: Container

# Image publishing (SPECIFICATION.md §16.2) and releases (§16.3). The pins come from the build args
# in docker/Dockerfile (mirrored in ci.yaml); this workflow does not repeat them.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 3 * * *" # nightly rebuild of main: base-image security updates
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lower case)
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev+${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # Releases (v* tags) -> 1.2.3 / 1.2 / 1 plus `latest`;
          # pushes to main, the nightly schedule and manual runs -> `nightly-dev`; every build -> git-<sha>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=nightly-dev,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=git-
          # `latest` only on release tags, never on a dev build.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=mxl-st2110-gateway
            org.opencontainers.image.description=SMPTE ST 2110 <-> MXL gateway (Intel MTL/DPDK, NMOS IS-04/IS-05, BCP-007-03)
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MXLGW_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=mxlgw
          cache-to: type=gha,scope=mxlgw,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error file=CHANGELOG.md::no section '## [$version]' in CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "## Image"
            echo
            echo '```'
            echo "${IMAGE}:${version}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> notes.md
          echo "${IMAGE}@${DIGEST}" > image-digest.txt

      - name: Assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p assets
          cp schema/gateway-config.schema.json monitoring/grafana/mxl-st2110-gateway.json docker/docker-compose.yaml image-digest.txt assets/
          tar -czf "assets/k8s-manifests-${version}.tar.gz" -C deploy k8s

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}" assets/*
